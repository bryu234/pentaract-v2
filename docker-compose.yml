name: pentaract-v2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentaract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-pentaract}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pentaract]

  telegram-bot-api:
    build:
      context: ./docker/telegram-bot-api
      args:
        TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 30
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
      - telegram-shared:/shared
    networks: [pentaract]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PENTARACT_DATABASE_URL: postgres://${POSTGRES_USER:-pentaract}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pentaract}
    ports:
      - "${PENTARACT_HTTP_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 20
    volumes:
      - ./data/secrets:/run/pentaract-secrets
      - ./data/uploads:/data/uploads
      - ./data/backups:/data/backups
      - telegram-shared:/shared
      - telegram-data:/var/lib/telegram-bot-api:ro
    networks: [pentaract]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: [production]
    environment:
      PENTARACT_DOMAIN: ${PENTARACT_DOMAIN:-storage.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [pentaract]

  app-test:
    build:
      context: .
      target: go-dev
    working_dir: /src
    command: ["go", "test", "./..."]
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    profiles: [tools]

  web-test:
    image: node:24-alpine
    working_dir: /src/web
    command: ["sh", "-c", "npm ci && npm test -- --run && npm run build"]
    volumes:
      - .:/src
      - web-modules:/src/web/node_modules
    profiles: [tools]

networks:
  pentaract:

volumes:
  postgres-data:
  telegram-data:
  telegram-shared:
  go-cache:
  web-modules:
  caddy-data:
  caddy-config:
